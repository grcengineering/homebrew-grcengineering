# SSCS Bootstrapper configuration — the single source of truth for which
# controls are enabled. Every control is independently toggleable here;
# no code changes required. Secure defaults are ON; optional integrations
# that need external services or extra tooling are OFF.
#
# Toggle:   sscsb enable <control> | sscsb disable <control>
# Inspect:  sscsb status | sscsb verify | sscsb report

[general]
# Branches where human-only signing and merge policy are enforced.
protected_branches = ["main"]
# fail_open = true would let hooks pass when scanners are missing. Keep false.
fail_open = false
github_repo = "grcengineering/homebrew-grcengineering"

# ── Phase 1 — Local source integrity ──

# Secret scanning hooks: TruffleHog and Gitleaks both block secrets at pre-commit
# and pre-push.
#
# Both run, deliberately. TruffleHog VERIFIES a candidate credential against the
# issuing provider, so it can tell "this looks like a key" apart from "this key is
# live right now" (`--results=verified,unknown` keeps unverifiable candidates in
# scope). Gitleaks runs alongside it: independent probes showed it catches generic
# secrets (e.g. `api_key = "<random>"`) and unverifiable keys that TruffleHog's
# verified/unknown filter still drops — a detection class TruffleHog alone does
# not cover.
[controls.secrets]
enabled = true
trufflehog = true
gitleaks = true
pre_push_range_scan = true
# sscsb 0.4.0 writes the sample `.gitleaks.toml` whenever the `secrets` control is
# enabled. With `gitleaks = true` that file is live config for the engine actually
# running here, not an orphan — review and maintain it like any other scanner
# config; don't delete it.

# CommitSigningGuard: Hardware-backed, human-only signing enforced on protected branches at pre-push
[controls.commit-signing]
enabled = true
require_hardware_backed = true
require_review_evidence_for_ai_merges = true

# AI agent commit signing: Verifiable AI-agent signatures (distinct identity, never valid on protected branches); off by default
[controls.agent-signing]
enabled = false
require_agent_signatures = false
allowed_backends = ["github-app", "tpm", "fido2", "kms", "piv", "software"]
max_key_age_days = 90

# Five-environment signing model: Machine-wide signing posture: human enclave lane, distinct agent identity, cloud/web/Codespaces guidance
# Lane identities are not config keys in sscsb 0.4.0 — the human key lives in
# .sscsb/policy/signers.toml and the un-probeable lanes (cloud / web / Codespaces)
# are dated attestations in .sscsb/policy/signing-model.toml. Setting `agent` /
# `human_backend` here was silently ignored on every run.
[controls.signing-model]
enabled = true

# Branch protection verification: Verify GitHub protected-branch rules (PRs, no force-push, signatures, checks)
[controls.branch-protection]
enabled = true

# Actions pinning & permissions audit: Flag mutable action refs and missing/over-broad workflow permissions
[controls.actions-audit]
enabled = true

# AI commit trailers: Validate AI-Assisted / AI-Tool / AI-Model / AI-Role commit trailers
[controls.ai-trailers]
enabled = true

# AI dependency & command gate: Extra gating when AI-assisted commits add dependencies or shell commands
[controls.ai-dep-gate]
enabled = false

# AI-provenance PR template: PR template asking whether AI generated code/tests/dependencies/docs
[controls.pr-template]
enabled = true

# AI provenance receipts: Optional cryptographic receipts linking commits to AI tool/model/role
[controls.ai-receipts]
enabled = false
sign_with_cosign = false

# ── Phase 2 — Dependency & vulnerability visibility ──

# SBOM generation: Syft SBOM in CycloneDX (default) or SPDX JSON
[controls.sbom]
enabled = false
format = "cyclonedx-json"

# Vulnerability scanning: Trivy (vuln+secret+misconfig) and OSV-Scanner V2 (lockfile-exact)
[controls.vuln-scan]
enabled = false
fail_on = "high"

# OpenSSF Scorecard: Scorecard workflow scoring repository security posture
[controls.scorecard]
enabled = true

# Renovate onboarding: Automated dependency updates with digest pinning + lockfile maintenance
[controls.renovate]
enabled = false

# Package trust gate: Existence validation, human approval for new packages, typosquat heuristics, lockfile-exact installs
[controls.package-trust]
enabled = false
registry_check = true
typosquat_check = true

# Grype (optional): SBOM-first vulnerability scanning where Syft+Grype is preferred
[controls.grype]
enabled = false

# Socket Firewall (optional): Malicious-package detection/blocking at install time
[controls.socket-firewall]
enabled = false

# ── Phase 3 — Provenance, signing & credential federation ──

# Sigstore keyless signing: Cosign keyless signing + SBOM/provenance attestations bound to digests
[controls.sigstore-signing]
enabled = false

# SLSA Build L3 provenance: slsa-github-generator reusable workflow (tag-pinned per its trust model)
[controls.slsa-provenance]
enabled = false

# GitHub artifact attestations / GitHub SBOM attestation: DISABLED, and the reason is
# structural rather than a deferral.
#
# Both controls install an `on: release published` workflow that builds something,
# attests the bytes, and verifies the attestation. This repository is a Homebrew TAP:
# it has no build, no tags and no releases (`gh release list` is empty, `git tag` is
# empty), and it never will — it ships Ruby metadata describing artifacts that are
# built, signed and attested in grcengineering/nthpartyfinder. Enabling them here
# would add two workflows that either never fire, or, if a tag were ever cut, attest
# a `git archive` tarball of the tap's own formula files. Attesting a stub is not
# provenance; it is a green check over a claim nobody makes.
#
# The provenance question a tap actually has to answer — "are the bytes this formula
# points at the ones upstream built?" — is answered by formula-integrity.yml, which
# downloads every (url, sha256) pair and verifies it against upstream's keyless
# signing identity with cosign and slsa-verifier, pinned to the expected source repo
# and tag, on every PR, every push to main, and weekly against already-merged
# formulae. The `provenance-verify` control below is the sscsb control that gates it.
#
# Re-enable both the day this repo builds and publishes an artifact of its own.
[controls.github-attestations]
enabled = false

[controls.sbom-attestation]
enabled = false

# Provenance verification gates: slsa-verifier + cosign verification required before
# promote/deploy/publish. Enabled — but note that `sscsb init` writes a
# `.github/workflows/deploy-gate.yml` for this control, and that workflow is
# unreachable in a tap: its `workflow_call` entry is only invoked by a `release.yml`
# this repo does not have, and its `workflow_dispatch` entry needs a published
# release tag (this repo has none). It is deliberately not committed; delete it if a
# future `sscsb init` puts it back. The verification that matters here runs in
# formula-integrity.yml against UPSTREAM's artifacts, which is what a distribution
# channel actually has to verify.
[controls.provenance-verify]
enabled = true
# Without this, `sscsb provenance verify` accepts provenance from ANY builder
# slsa-verifier trusts for the source repo — "something built this" rather than
# "the builder we expect built this". Pinned to the builder that actually produced
# the provenance the tap's formulae point at: read out of
# grcengineering/nthpartyfinder v1.8.3's multiple.intoto.jsonl
# (predicate https://slsa.dev/provenance/v0.2), not assumed.
builder_id = "https://github.com/slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@refs/tags/v2.1.0"

# Octo STS federation: Short-lived repo-scoped GitHub credentials replacing long-lived PATs
[controls.octo-sts]
enabled = false

# Harden-Runner: StepSecurity Harden-Runner egress/tamper monitoring in every workflow
# The egress policy itself is a per-workflow input (`with: egress-policy:`), not a
# config key sscsb 0.4.0 reads; setting `egress_policy` here was silently ignored.
# Every workflow in this repo runs harden-runner in `audit` mode — the audit output
# is the input to a future `block` allowlist.
[controls.harden-runner]
enabled = true

# Witness (optional): Richer in-toto attestation capture and policy around build steps
[controls.witness]
enabled = false

# ── Phase 4 — Deeper code security & CI hardening ──

# SAST (OpenGrep default): OpenGrep rule-driven SAST in pre-commit and CI; Semgrep selectable
[controls.sast]
enabled = true
engine = "opengrep"
pre_commit = false
rules = ".sscsb/rules"

# Sighthound (optional): Ultra-fast local pre-commit SAST layer
[controls.sighthound]
enabled = false

# CodeQL: Deep interprocedural analysis on PRs and default branch
[controls.codeql]
enabled = true

# Extended workflow audit: pull_request_target misuse, credential persistence, secret echo, risky actions
[controls.workflow-audit-extended]
enabled = true

# StepSecurity secure-repo: Onboarding accelerator via app.stepsecurity.io (web service, not an action)
[controls.secure-repo]
enabled = true

# wait-for-secrets (optional): Human-in-the-loop secret injection for high-sensitivity workflows
[controls.wait-for-secrets]
enabled = false

# ── Phase 5 — Observability & governance ──

# Dependency-Track: Continuous SBOM management platform (self-hosted); sscsb uploads BOMs
[controls.dependency-track]
enabled = false
url = ""
project_name = ""

# GUAC ingestion: Supply-chain knowledge graph over SBOMs, attestations, and VEX
[controls.guac]
enabled = false

# OpenVEX: Generate and ingest VEX for exploitability-aware triage
[controls.openvex]
enabled = false

# ORAS OCI storage (optional): Push SBOMs/attestations to an OCI registry as reference artifacts
[controls.oras]
enabled = false

# Compliance map & report: Machine-readable control → SLSA/SSDF/CRA/Badge map behind `sscsb report`
[controls.compliance-map]
enabled = true

