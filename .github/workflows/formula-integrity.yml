# Formula artifact integrity — the load-bearing control for this tap.
#
# A tap is a distribution channel. Whoever lands a commit on `main` decides what
# `brew install` puts on a user's machine, and this tap ships *prebuilt* binaries,
# so it does not get homebrew-core's build-from-source protection. Homebrew's own
# attestation verification does not cover us either: `HOMEBREW_VERIFY_ATTESTATIONS`
# is hard-gated to core taps and to bottle installs in formula_installer.rb, so a
# third-party tap fetching a release tarball gets no attestation check at install
# time.
#
# So the binding happens here, before merge: every (url, sha256) pair in every
# formula is downloaded, hashed, and verified against upstream's keyless signing
# identity, pinned to both the expected source repo and the expected tag. Two
# provenance formats are handled — a per-artifact cosign Sigstore bundle
# (nthpartyfinder v1.4.0+) and a release-wide SLSA provenance file
# (v1.3.x and earlier) — so both cosign and slsa-verifier are installed.
#
# Why the digest check alone is not enough: an attacker who can edit a formula
# edits the url and the sha256 *together*, and the digest agrees with itself. The
# provenance check is what they cannot forge — they would need a signature from
# upstream's release workflow, running under upstream's repo at the expected tag,
# for an artifact upstream never built.
#
# The weekly schedule matters as much as the PR run: it re-verifies artifacts that
# were already merged, so a release asset that is swapped, deleted, or re-pointed
# after the fact gets caught rather than silently serving new bytes under an old
# reviewed digest.
#
# All actions are pinned to full 40-character commit SHAs (sscsb actions-audit
# enforces this). egress-policy is `audit` to match the rest of this repo and to
# avoid guessing Sigstore's endpoint set; the audit output is the input to a future
# `block` allowlist.
name: Formula Integrity

on:
  pull_request:
    paths:
      # Homebrew loads tap formulae from Formula/, HomebrewFormula/, AND the repo
      # root, so all three must trigger verification — otherwise a formula added
      # outside Formula/ would be installable but never checked.
      - "Formula/**"
      - "HomebrewFormula/**"
      - "*.rb"
      - "scripts/verify-formula-artifacts.rb"
      - ".github/workflows/formula-integrity.yml"
  push:
    branches: ["main"]
    paths:
      # Homebrew loads tap formulae from Formula/, HomebrewFormula/, AND the repo
      # root, so all three must trigger verification — otherwise a formula added
      # outside Formula/ would be installable but never checked.
      - "Formula/**"
      - "HomebrewFormula/**"
      - "*.rb"
      - "scripts/verify-formula-artifacts.rb"
      - ".github/workflows/formula-integrity.yml"
  schedule:
    # Re-verify already-merged formulae weekly: catches post-merge tampering,
    # deleted release assets, and re-pointed tags.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formula-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify formula artifacts + SLSA provenance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install slsa-verifier
        uses: slsa-framework/slsa-verifier/actions/installer@ea584f4502babc6f60d9bc799dbbb13c1caa9ee6 # v2.7.1

      - name: Show verifier versions
        run: |
          cosign version
          slsa-verifier version

      - name: Verify every formula artifact
        run: ruby scripts/verify-formula-artifacts.rb
