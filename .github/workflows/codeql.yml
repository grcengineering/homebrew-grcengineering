# sscsb: CodeQL — deep interprocedural analysis on PRs and the default branch.
#
# `ruby` was added to sscsb's stock `actions`-only matrix: this repo's source is
# Ruby (the formulae and scripts/verify-formula-artifacts.rb), and CodeQL that
# does not read your source code is not analysing your source code.
#
# Calibration note: CodeQL's Ruby extractor understands Ruby syntax but knows
# nothing of the Homebrew Formula DSL, so it will not reason about `url`/`sha256`
# semantics. It is here to catch ordinary Ruby defects — command injection in an
# install block, unsafe deserialisation, tainted path construction — not to
# validate formula correctness. That is what formula-integrity.yml and
# `brew audit` are for.
name: CodeQL
on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "45 3 * * 2"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["actions", "ruby"]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}
      - name: Analyze
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: "/language:${{ matrix.language }}"
