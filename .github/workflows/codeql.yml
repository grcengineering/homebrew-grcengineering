# sscsb: CodeQL — deep interprocedural analysis on PRs and the default branch.
#
# `ruby` was added to sscsb's stock `actions`-only matrix: this repo's source is
# Ruby (the formulae and scripts/verify-formula-artifacts.rb), and CodeQL that
# does not read your source code is not analysing your source code.
#
# Calibration note: CodeQL's Ruby extractor understands Ruby syntax but knows
# nothing of the Homebrew Formula DSL, so it will not reason about `url`/`sha256`
# semantics. It is here to catch ordinary Ruby defects — command injection in an
# install block, unsafe deserialisation, tainted path construction — not to
# validate formula correctness. That is what formula-integrity.yml and
# `brew audit` are for.
name: CodeQL
on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "45 3 * * 2"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["actions", "ruby"]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
      - name: Analyze
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: "/language:${{ matrix.language }}"
