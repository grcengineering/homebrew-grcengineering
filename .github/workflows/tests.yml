# Homebrew's own correctness gates for this tap.
#
# Adapted from Homebrew's shipped `tap-new-tests.yml` template, with two
# deliberate deviations, both to satisfy this repo's hardening baseline:
#
#   1. The Linux leg runs directly on `ubuntu-latest` instead of inside the
#      `ghcr.io/homebrew/brew` container. StepSecurity's harden-runner cannot
#      instrument a job running in a container, and this repo requires egress
#      monitoring on every job. setup-homebrew installs Homebrew on the runner
#      instead, which costs a little time and buys uniform runner hardening.
#   2. Every action is pinned to a full 40-character commit SHA. Homebrew/actions
#      is tagged CalVer, and its own README is explicit that a CalVer tag "does
#      not imply semantic compatibility" — so pinning is both a supply-chain
#      control (cf. tj-actions/changed-files, CVE-2025-30066) and a stability one.
#
# `--only-tap-syntax` is what runs `brew style` and `brew audit` over the tap.
# `--only-formulae` actually builds and tests changed formulae, so it is gated to
# pull requests, matching upstream.
name: brew test-bot

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-bot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-bot:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-26, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@9af03b7ae3f9e2ae5c174f659d5c3909f7e7dbac # 2026.07.29.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - name: Style and audit the tap
        run: brew test-bot --only-tap-syntax

      - name: Build and test changed formulae
        if: github.event_name == 'pull_request'
        run: brew test-bot --only-formulae

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bottles_${{ matrix.os }}
          path: "*.bottle.*"
          if-no-files-found: ignore
