# sscsb: CI secret-scanning redundancy (TruffleHog + Gitleaks).
# Local hooks block first; this catches anything that slips past (e.g. web UI commits).
# All actions pinned to full commit SHAs (sscsb actions-audit enforces this).
name: Secret Scan
on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Checkout (full history for diff scanning)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Upstream README suggests @main; sscsb pins the release SHA instead (v3.95.9).
      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
        with:
          extra_args: --results=verified,unknown

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The gitleaks *CLI* (MIT) is used directly rather than
      # gitleaks/gitleaks-action, which requires a paid GITLEAKS_LICENSE for
      # organization repositories. This runs the same engine the local sscsb
      # pre-commit/pre-push hooks use, against the tap's own .gitleaks.toml.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Gitleaks scan (full history)
        run: gitleaks git --config .gitleaks.toml --redact --no-banner .
