# sscsb: CI secret-scanning backstop (TruffleHog).
# Local hooks block first; this catches anything that slips past (e.g. web UI commits),
# and unlike the hooks it re-reads the FULL history on every run.
#
# TruffleHog is the only secret scanner here, on purpose. A Gitleaks job used to run
# beside it over the same diff; both are pattern/entropy engines, but TruffleHog also
# VERIFIES a candidate credential against the issuing provider, so it distinguishes
# "this looks like a key" from "this key is live right now". A second, non-verifying
# engine bought duplicate findings and a second allowlist file to keep correct —
# another place to open a blind spot — without adding a detection class TruffleHog
# lacks. `--results=verified,unknown` keeps the unverifiable candidates in scope, so
# dropping Gitleaks does not narrow what gets reported.
#
# All actions pinned to full commit SHAs (sscsb actions-audit enforces this).
name: Secret Scan
on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Checkout (full history for diff scanning)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Upstream README suggests @main; sscsb pins the release SHA instead (see the
      # version comment on the `uses:` line, kept current by Dependabot).
      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          extra_args: --results=verified,unknown

